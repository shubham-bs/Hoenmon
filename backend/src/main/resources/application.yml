spring:
  application:
    name: home-energy-monitor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homeenergymonitor}
    username: ${DB_USERNAME:homeenergymonitor}
    password: ${DB_PASSWORD:homeenergymonitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  telemetry:
    interval-ms: 3000
    heartbeat-ms: 15000
    scheduling-enabled: true
  simulation:
    meter-serial: SIM-0001
    nominal-voltage: 230.0
    nominal-frequency: 50.0
