services:
  postgres:
    image: postgres:16-alpine
    container_name: homeenergymonitor-postgres
    environment:
      POSTGRES_DB: homeenergymonitor
      POSTGRES_USER: homeenergymonitor
      POSTGRES_PASSWORD: homeenergymonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeenergymonitor -d homeenergymonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
